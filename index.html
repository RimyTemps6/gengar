<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Organizador de Driver FTC - BrainMachine #17728</title>
    <meta name="theme-color" content="#8A2BE2">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="BrainMachine">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>⚙️ BrainMachine #17728</h1>

    <div class="topbar">
        <span class="pill" id="status">Conectando…</span>
        <button class="btn-small" id="installBtn" hidden>📲 Instalar app</button>
    </div>

    <div class="container">
        <!-- Mapeamento de Controles -->
        <div class="controllers-container" id="controllers">
            <div class="controller-card" id="ctrl1">
                <h2>🎮 Controle 0 (Driver)</h2>
                <div class="button-grid">
                    <div class="button-row">
                        <div class="ctrl-input-group"><span class="ctrl-label">LB:</span><input type="text" class="ctrl-input" data-ctrl="0" data-btn="LB" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">RB:</span><input type="text" class="ctrl-input" data-ctrl="0" data-btn="RB" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">LT:</span><input type="text" class="ctrl-input" data-ctrl="0" data-btn="LT" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">RT:</span><input type="text" class="ctrl-input" data-ctrl="0" data-btn="RT" value="S/V"></div>
                    </div>
                    <div class="button-row">
                        <div class="ctrl-input-group"><span class="ctrl-label">A:</span><input type="text" class="ctrl-input" data-ctrl="0" data-btn="A" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">B:</span><input type="text" class="ctrl-input" data-ctrl="0" data-btn="B" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">X:</span><input type="text" class="ctrl-input" data-ctrl="0" data-btn="X" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">Y:</span><input type="text" class="ctrl-input" data-ctrl="0" data-btn="Y" value="S/V"></div>
                    </div>
                </div>
            </div>
            <div class="controller-card" id="ctrl2">
                <h2>🎮 Controle 1 (Operator)</h2>
                <div class="button-grid">
                    <div class="button-row">
                        <div class="ctrl-input-group"><span class="ctrl-label">LB:</span><input type="text" class="ctrl-input" data-ctrl="1" data-btn="LB" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">RB:</span><input type="text" class="ctrl-input" data-ctrl="1" data-btn="RB" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">LT:</span><input type="text" class="ctrl-input" data-ctrl="1" data-btn="LT" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">RT:</span><input type="text" class="ctrl-input" data-ctrl="1" data-btn="RT" value="S/V"></div>
                    </div>
                    <div class="button-row">
                        <div class="ctrl-input-group"><span class="ctrl-label">A:</span><input type="text" class="ctrl-input" data-ctrl="1" data-btn="A" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">B:</span><input type="text" class="ctrl-input" data-ctrl="1" data-btn="B" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">X:</span><input type="text" class="ctrl-input" data-ctrl="1" data-btn="X" value="S/V"></div>
                        <div class="ctrl-input-group"><span class="ctrl-label">Y:</span><input type="text" class="ctrl-input" data-ctrl="1" data-btn="Y" value="S/V"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="app"></div>
        <button class="add-section-btn" id="addSectionBtn">➕ Nova seção</button>
    </div>

    <div class="export-area" id="exportArea">
        <div class="section-title">📄 Configuração Final</div>
        <textarea id="outputText" readonly></textarea>
        <div class="export-actions">
            <button class="primary" id="copyBtn">Copiar</button>
            <button id="backBtn">Voltar</button>
        </div>
    </div>

    <button class="save-btn" id="exportBtn">💾 Gerar Configuração</button>

    <div class="footer">
        BrainMachine #17728 &copy; 2026
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
